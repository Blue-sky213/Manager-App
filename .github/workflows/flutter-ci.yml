# verify-noir-manager — รัน analyze + test ทุกครั้งที่ push / เปิด PR
# ผลลัพธ์ในแท็บ Actions คือ "หลักฐาน" ตาม docs/PRINCIPLES.md ข้อ 3
name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noir_manager
    steps:
      - uses: actions/checkout@v4

      # sqflite_common_ffi ในเทสต้องใช้ไลบรารี SQLite ของระบบ
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      # ไม่ให้ info/warning ทำ CI แดง (ยังค้าง 11 ข้อ) — แต่ error ต้องเป็น 0
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded
