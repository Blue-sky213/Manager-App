# verify-noir-manager — รัน analyze + test ทุกครั้งที่ push / เปิด PR
# ผลลัพธ์ในแท็บ Actions คือ "หลักฐาน" ตาม docs/PRINCIPLES.md ข้อ 3
name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noir_manager
    steps:
      - uses: actions/checkout@v4

      # sqflite_common_ffi ในเทสต้องใช้ไลบรารี SQLite ของระบบ
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      # ไม่ให้ info/warning ทำ CI แดง (ยังค้าง 13 ข้อ) — แต่ error ต้องเป็น 0
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  # สร้างไฟล์ติดตั้ง Android (.apk) ให้นัวร์โหลดไปลงมือถือได้เลย ไม่ต้องตั้ง Android SDK ในเครื่อง
  # รันเฉพาะ PR / main / กดเอง (ใช้เวลานานกว่าเทส)
  android-apk:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noir_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # แยกไฟล์ตามชิป → ไฟล์ arm64 (มือถือเกือบทุกรุ่นตั้งแต่ปี 2017) เล็กลงมาก
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: noir-manager-android
          path: noir_manager/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

  # ตัวติดตั้ง Windows (Setup.exe) — ดับเบิลคลิกติดตั้ง มีไอคอนเดสก์ท็อป / Start menu / ถอนการติดตั้งได้
  windows-installer:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: noir_manager
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # เวอร์ชันจาก pubspec (1.0.0+1 → 1.0.0)
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" windows\installer\noir_manager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: noir-manager-windows-setup
          path: noir_manager/build/installer/*.exe
          retention-days: 14

  # รอบ 17: เว็บ (เปิดผ่าน Chrome / Safari บน iPhone) · build ทุก push (ให้เทสได้) · ขึ้นเว็บจริงเฉพาะ main
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noir_manager
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # SQLite แบบ WebAssembly → web/sqlite3.wasm + web/sqflite_sw.js
      - name: Setup SQLite for web
        run: dart run sqflite_common_ffi_web:setup --force

      # GitHub Pages อยู่ใต้ /Manager-App/
      - name: Build web
        run: flutter build web --release --base-href /Manager-App/

      - uses: actions/upload-artifact@v4
        with:
          name: noir-manager-web
          path: noir_manager/build/web
          retention-days: 7

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: noir_manager/build/web

  # ขึ้นเว็บจริง: https://blue-sky213.github.io/Manager-App/ (ต้องเปิด Settings › Pages › Source = GitHub Actions ครั้งเดียว)
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
