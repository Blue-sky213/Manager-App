name: noir_manager
description: "Noir Manager — ผู้จัดการส่วนตัว: ปฏิทิน แผนเรียน ไฟล์"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ฐานข้อมูล SQLite ในเครื่อง
  sqflite: ^2.4.0 # Android (และ iOS/macOS ในอนาคต)
  sqflite_common_ffi: ^2.4.0 # Windows (ใช้ SQLite ผ่าน FFI)
  path_provider: ^2.1.0 # หาโฟลเดอร์เก็บข้อมูลของแอปในแต่ละระบบ
  path: ^1.9.0 # ต่อชื่อโฟลเดอร์ + ไฟล์ให้ถูกแบบของแต่ละระบบ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ฟอนต์ไทยตาม Mockup (ลิขสิทธิ์ SIL OFL อยู่ใน assets/fonts/OFL.txt)
  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
